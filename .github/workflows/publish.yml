name: Publish Python Package

on:
  push:
    tags:
      - "v*"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for PyPI OIDC authentication
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          # Match the minimum supported version. 3.14 currently fails to
          # import httpcore (see test.yml comment); the wheel is pure-Python
          # so the build interpreter doesn't matter.
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Verify tag matches package version
        run: |
          # Extract version from tag (remove 'v' prefix)
          TAG_VERSION=${GITHUB_REF#refs/tags/v}

          # Extract version from pyproject.toml
          PACKAGE_VERSION=$(grep -o 'version = "[^"]*"' pyproject.toml | cut -d'"' -f2)

          echo "Tag version: $TAG_VERSION"
          echo "Package version: $PACKAGE_VERSION"

          # Verify versions match
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package version ($PACKAGE_VERSION)"
            exit 1
          fi

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run tests
        env:
          ELEVENLABS_API_KEY: dummy
        run: |
          uv run pytest --cov=elevenlabs_mcp

      - name: Build package
        run: |
          uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
